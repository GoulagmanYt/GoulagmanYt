name: Update profile

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'assets/fonts/**'
      - '.github/workflows/profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s tests
      - name: Draw profile
        run: python scripts/update_profile.py
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
      - name: Save updated artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/name.svg assets/workbench.svg assets/toolbox.svg assets/languages.svg assets/activity.svg assets/stats.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile stats"
            git pull --rebase
            git push
          fi
